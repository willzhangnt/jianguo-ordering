name: keep-alive
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping ordering site
        run: |
          curl -s -o /dev/null -w "home: %{http_code}\n" --max-time 120 https://jianguo-ordering.onrender.com/
          curl -s -o /dev/null -w "api:  %{http_code}\n" --max-time 120 https://jianguo-ordering.onrender.com/api/products
